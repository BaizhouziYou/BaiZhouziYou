name: Update GitHub Profile Cards

on:
  schedule:
    # 07:00 (UTC+8); GitHub Actions cron is in UTC.
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-profile-cards
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Check GitHub data token
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        run: |
          if [ -z "$PROFILE_STATS_TOKEN" ]; then
            echo '::error::Missing SUMMARY_GITHUB_TOKEN repository secret.'
            exit 1
          fi

      # Generate locally stored SVGs (not public web-service URLs).
      - name: Generate stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=BaizhouziYou&theme=default&show_icons=true&hide_rank=false&rank_icon=default
          path: profile-assets/stats-light.svg
          token: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=BaizhouziYou&theme=github_dark&show_icons=true&hide_rank=false&rank_icon=default
          path: profile-assets/stats-dark.svg
          token: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate language card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=BaizhouziYou&theme=default&layout=normal&langs_count=5
          path: profile-assets/langs-light.svg
          token: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate language card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=BaizhouziYou&theme=github_dark&layout=normal&langs_count=5
          path: profile-assets/langs-dark.svg
          token: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate contribution calendar and activity overview (light + dark)
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
          PROFILE_STATS_USERNAME: BaizhouziYou
        run: python3 scripts/generate_contributions.py

      - name: Verify generated SVGs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          names = ['stats-light', 'stats-dark', 'langs-light', 'langs-dark',
                   'contributions-light', 'contributions-dark',
                   'activity-light', 'activity-dark']
          for name in names:
              path = Path('profile-assets') / f'{name}.svg'
              if not path.is_file() or path.stat().st_size < 100:
                  raise SystemExit(f'Missing or empty SVG: {path}')
              root = ET.parse(path).getroot()
              if not root.tag.endswith('svg'):
                  raise SystemExit(f'Invalid SVG: {path}')
              print(f'OK: {path} ({path.stat().st_size} bytes)')
          PY

      - name: Commit generated assets safely (retry on concurrent updates)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Keep the just-generated images outside the repository while syncing.
          # This preserves any concurrent README or workflow edits on main.
          mkdir -p "$RUNNER_TEMP/generated-profile-assets"
          cp profile-assets/*.svg "$RUNNER_TEMP/generated-profile-assets/"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p profile-assets
            cp "$RUNNER_TEMP/generated-profile-assets/"*.svg profile-assets/
            git add -A -- profile-assets/
            if git diff --cached --quiet; then
              echo 'No SVG changes to commit.'
              exit 0
            fi
            git commit -m 'chore: refresh GitHub profile SVGs [skip ci]'
            if git push origin HEAD:main; then
              echo 'Generated SVGs pushed successfully.'
              exit 0
            fi
            echo "Remote main advanced during attempt ${attempt}; retrying."
            sleep "$((attempt * 2))"
          done
          echo '::error::Could not push SVGs after five attempts.'
          exit 1
